
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Что сделать до конца года по обособленным подразделениям</title>
<style>
:root {
  --red:#CA4037;
  --pink:#FAE8E4;
  --gold:#b18f20;
  --orange:#F5811F;
  --ink:#2A2F33;
  --line:#e8e3dc;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:#fff;
  color:var(--ink);
  font:15px/1.46 Arial,Helvetica,sans-serif;
}
.widget {
  width:757px;
  max-width:100%;
  margin:0 auto;
  padding:12px 12px 14px;
  background:#faf9f7;
  position:relative;
}
h1 {
  font-size:22px;
  line-height:1.2;
  margin:0 0 7px;
  font-weight:750;
}
.top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:8px;
}
.progress-label {
  font-size:13px;
  font-weight:700;
  color:var(--gold);
}
.progress {
  width:125px;
  height:5px;
  border-radius:8px;
  background:#e9e4d8;
  overflow:hidden;
}
.progress>div {
  height:100%;
  background:var(--gold);
  width:0;
  transition:width .15s;
}
.cards {display:grid;gap:5px}
.card {
  position:relative;
  display:grid;
  grid-template-columns:34px minmax(0,1fr) 26px;
  gap:8px;
  padding:9px 10px 8px;
  background:white;
  border:1px solid var(--line);
  border-radius:12px;
  transition:border-color .15s;
}
.card.completed {border-color:var(--gold)}
.ico {
  width:30px;
  height:30px;
  color:var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
}
.ico svg {
  width:27px;
  height:27px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.65;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.card h2 {
  font-size:15px;
  line-height:1.28;
  margin:0 0 3px;
}
.card p {
  margin:0 0 4px;
  font-size:13.5px;
  line-height:1.35;
}
.warning-trigger {
  border:0;
  padding:0;
  background:transparent;
  color:var(--red);
  font:700 12.5px/1.4 Arial;
  cursor:pointer;
  display:inline-flex;
  gap:6px;
  align-items:center;
}
.warning-trigger:hover,
.warning-trigger:focus-visible {color:var(--orange)}
.warning-trigger:focus-visible,
.done:focus-visible,
.pdf:focus-visible,
.reset:focus-visible {
  outline:2px solid var(--orange);
  outline-offset:3px;
}
.done {
  width:24px;
  height:24px;
  accent-color:var(--gold);
  cursor:pointer;
  margin:0;
}
.tooltip {
  position:absolute;
  z-index:50;
  max-width:320px;
  width:max-content;
  padding:12px 14px;
  border:1px solid var(--red);
  border-radius:10px;
  background:var(--pink);
  color:var(--ink);
  font-size:13px;
  line-height:1.45;
  box-shadow:0 7px 22px #2a2f3320;
  pointer-events:auto;
}
.tooltip[hidden] {display:none}
.footer {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:8px;
}
.reset {
  border:0;
  background:none;
  color:#666;
  font-size:12px;
  text-decoration:underline;
  cursor:pointer;
}
.pdf {
  border:0;
  border-radius:8px;
  background:var(--red);
  color:white;
  font-weight:700;
  padding:10px 16px;
  cursor:pointer;
}
.pdf:hover {background:#ad342d}
.pdf:disabled {opacity:.65;cursor:wait}
.status {
  font-size:12px;
  color:var(--red);
  margin-top:6px;
  min-height:0;
}
.print-only {display:none}
@media(max-width:520px) {
  .widget {padding:10px 8px}
  h1 {font-size:19px}
  .card {
    grid-template-columns:32px minmax(0,1fr) 24px;
    gap:6px;
    padding:8px 7px;
  }
  .ico {width:30px}
  .ico svg {width:27px}
  .card p {font-size:13px}
  .progress {width:75px}
}
@media(prefers-reduced-motion:reduce) {
  * {transition:none!important}
}
/* Макет для PDF */
.pdf-sheet {
  width:794px;
  background:white;
  color:var(--ink);
  padding:30px 35px;
  font:14px/1.38 Arial,Helvetica,sans-serif;
}
.pdf-sheet h1 {font-size:23px;margin-bottom:15px}
.pdf-sheet .pdf-item {
  border:1px solid #ddd5c8;
  border-radius:8px;
  margin-bottom:9px;
  padding:11px 13px;
  break-inside:avoid;
}
.pdf-sheet .pdf-heading {
  display:flex;
  justify-content:space-between;
  gap:12px;
  font-size:15px;
  font-weight:bold;
  margin-bottom:5px;
}
.pdf-sheet p {margin:0 0 6px}
.pdf-sheet .pdf-warning {
  background:var(--pink);
  padding:7px 9px;
  border-left:3px solid var(--red);
  font-size:12.5px;
}
.pdf-sheet .pdf-check {
  color:var(--gold);
  white-space:nowrap;
}
.pdf-sheet .pdf-check.unchecked {color:#777}
@media print {
  body {background:white}
  .widget {display:none!important}
  .print-only {display:block!important}
  .pdf-sheet {width:100%;padding:0}
  .pdf-sheet .pdf-item {break-inside:avoid}
  @page {size:A4 portrait;margin:12mm}
}
</style>
</head>
<body>
<main class="widget" id="widget">
  <h1>Что сделать до конца года по обособленным подразделениям</h1>
  <div class="top">
    <span class="progress-label" id="counter">Выполнено 0 из 5</span>
    <div class="progress" aria-hidden="true"><div id="bar"></div></div>
  </div>
  <div class="cards" id="cards"></div>
  <div class="footer">
    <button class="reset" id="reset" type="button">Сбросить отметки</button>
    <button class="pdf" id="pdf" type="button">↓ Сохранить PDF</button>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
</main>
<div class="print-only" id="print-version"></div>
<script>
// РЕДАКТИРОВАНИЕ ТЕКСТОВ: меняйте title, body и warning.
const items=[
  {
    id:'policy',
    icon:'checklist',
    title:'Проверьте учетную политику',
    body:'Убедитесь, что в ней есть показатель для расчета доли прибыли, приходящейся на обособленные подразделения (среднесписочная численность или ФОТ). Если показателя нет или он сформулирован размыто — уточните формулировку.',
    warning:'При проверке возникнут вопросы, почему для распределения налога выбрали именно такую базу. Смена показателя задним числом невозможна.'
  },
  {
    id:'software',
    icon:'settings',
    title:'Перенастройте учетные системы',
    body:'Обновите ПО так, чтобы программа формировала одну декларацию с множеством приложений № 5 к листу 02 и подразделов 1.1, 1.2 раздела 1, а не множество отдельных деклараций.',
    warning:'В январе программа продолжит формировать отдельные декларации по каждому подразделению — данные придется сводить вручную.'
  },
  {
    id:'people',
    icon:'people',
    title:'Назначьте ответственного за сбор данных',
    body:'Определитесь, кто в головном офисе отвечает за сбор данных от всех обособленных подразделений. Установите сроки и формат передачи сведений, а также порядок проверки их корректности.',
    warning:'Единая декларация будет собираться с ошибками: подразделения продолжат работать автономно, а консолидации не будет.'
  },
  {
    id:'building',
    icon:'building',
    title:'Закройте неработающие подразделения',
    body:'Официально закройте обособленные подразделения, которые фактически не работают.',
    warning:'Каждое лишнее подразделение — дополнительная строка в расчете, дополнительный контроль со стороны ИФНС и дополнительный риск ошибки.'
  },
  {
    id:'branch',
    icon:'network',
    title:'Выберите ответственное подразделение',
    body:'Если решили применять централизованную уплату налога, выберите ответственное обособленное подразделение.',
    warning:'Если платить налог через каждое обособленное подразделение, то при большом количестве таких подразделений потребуется больше ресурсов.'
  }
];

const paths={
  checklist:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="m8 9 1.5 1.5L12 8M14 9h3M8 15l1.5 1.5L12 14M14 15h3"/>',
  settings:'<path d="M5 3h10l4 4v14H5zM15 3v5h4M8 12h5M8 16h4"/><circle cx="17" cy="16" r="3"/><path d="M17 12v1m0 6v1m-4-4h1m6 0h1"/>',
  people:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20v-2c0-3 2.5-5 6-5s6 2 6 5v2M15 14c3 0 6 2 6 5v1"/>',
  building:'<path d="M4 21V5l8-3 8 3v16M2 21h20M8 8h1m5 0h1M8 12h1m5 0h1M8 16h1m5 0h1M10 21v-4h4v4"/>',
  network:'<rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="7" height="5" rx="1"/><rect x="15" y="17" width="7" height="5" rx="1"/><path d="M12 7v5M5.5 17v-5h13v5"/>'
};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]}</svg>`;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

const key='fd-subdivision-checklist-v1';
let checked={};
try {
  checked=JSON.parse(localStorage.getItem(key)||'{}')||{};
} catch(e) {}

const cards=document.getElementById('cards');
cards.innerHTML=items.map((it,i)=>`
<section class="card ${checked[it.id]?'completed':''}" data-id="${it.id}">
  <div class="ico">${icon(it.icon)}</div>
  <div>
    <h2>${escapeHTML(it.title)}</h2>
    <p>${escapeHTML(it.body)}</p>
    <button type="button" class="warning-trigger"
      aria-describedby="tip-${i}" aria-expanded="false">⚠ Если не сделать</button>
  </div>
  <input class="done" type="checkbox"
    aria-label="Выполнено: ${escapeHTML(it.title)}"
    ${checked[it.id]?'checked':''}>
  <div class="tooltip" id="tip-${i}" role="tooltip" hidden>
    ${escapeHTML(it.warning)}
  </div>
</section>`).join('');

const tooltips=[...document.querySelectorAll('.tooltip')];

function hideTip(t) {
  t.hidden=true;
  const trigger=t.closest('.card').querySelector('.warning-trigger');
  trigger.setAttribute('aria-expanded','false');
}
function hideAll(except) {
  tooltips.forEach(t=>{if(t!==except)hideTip(t)});
}
function positionTip(t,trigger) {
  const widget=document.getElementById('widget');
  const card=t.closest('.card');
  const wr=widget.getBoundingClientRect();
  const cr=card.getBoundingClientRect();
  const tr=trigger.getBoundingClientRect();

  t.style.width=Math.min(320,wr.width-20)+'px';
  t.style.left='0px';
  t.style.top='0px';

  const width=t.offsetWidth;
  const height=t.offsetHeight;

  // Подсказка располагается рядом со ссылкой.
  let left=tr.right-cr.left+8;
  if(cr.left+left+width>wr.right-8)
    left=tr.left-cr.left-width-8;
  if(cr.left+left<wr.left+8)
    left=Math.max(wr.left+8-cr.left,tr.left-cr.left);

  let top=tr.top-cr.top+(tr.height-height)/2;
  if(cr.top+top<wr.top+6)
    top=wr.top+6-cr.top;
  if(cr.top+top+height>wr.bottom-6)
    top=wr.bottom-6-cr.top-height;

  t.style.left=left+'px';
  t.style.top=top+'px';
}
let activeTip=null;
function showTip(t,trigger) {
  hideAll(t);
  t.hidden=false;
  trigger.setAttribute('aria-expanded','true');
  positionTip(t,trigger);
  activeTip=t;
}
document.querySelectorAll('.card').forEach(card=>{
  const trigger=card.querySelector('.warning-trigger');
  const tip=card.querySelector('.tooltip');
  const cb=card.querySelector('.done');
  let hideTimer;

  const cancel=()=>clearTimeout(hideTimer);
  const delayed=()=>{
    cancel();
    hideTimer=setTimeout(()=>{
      if(!tip.matches(':hover') &&
         !trigger.matches(':hover') &&
         !trigger.matches(':focus-visible'))
        hideTip(tip);
    },90);
  };

  trigger.addEventListener('mouseenter',()=>{
    cancel();
    showTip(tip,trigger);
  });
  trigger.addEventListener('mouseleave',delayed);
  tip.addEventListener('mouseenter',cancel);
  tip.addEventListener('mouseleave',delayed);
  trigger.addEventListener('focus',()=>showTip(tip,trigger));
  trigger.addEventListener('blur',delayed);
  trigger.addEventListener('click',()=>{
    if(!tip.hidden && matchMedia('(hover:none)').matches)
      hideTip(tip);
    else showTip(tip,trigger);
  });

  cb.addEventListener('change',()=>{
    checked[card.dataset.id]=cb.checked;
    card.classList.toggle('completed',cb.checked);
    try {
      localStorage.setItem(key,JSON.stringify(checked));
    } catch(e) {}
    update();
  });
});
document.addEventListener('pointerdown',e=>{
  if(!e.target.closest('.warning-trigger') &&
     !e.target.closest('.tooltip')) hideAll();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')hideAll();
});
window.addEventListener('resize',()=>{
  if(activeTip&&!activeTip.hidden)
    positionTip(activeTip,activeTip.closest('.card').querySelector('.warning-trigger'));
  reportHeight();
});

function update() {
  const n=items.filter(x=>checked[x.id]).length;
  document.getElementById('counter').textContent=`Выполнено ${n} из ${items.length}`;
  document.getElementById('bar').style.width=100*n/items.length+'%';
}
update();

document.getElementById('reset').addEventListener('click',()=>{
  checked={};
  document.querySelectorAll('.done').forEach(c=>c.checked=false);
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('completed'));
  try {localStorage.removeItem(key)} catch(e) {}
  update();
});


 // PDF
function makePdfSheet() {
  const sheet = document.createElement('div');
  sheet.className = 'pdf-sheet';

  sheet.innerHTML =
    '<h1>Что сделать до конца года по обособленным подразделениям</h1>' +
    items.map(it => `
      <section class="pdf-item">
        <div class="pdf-heading">
          <span>${escapeHTML(it.title)}</span>
          <span class="pdf-check ${checked[it.id] ? '' : 'unchecked'}">
            ${checked[it.id] ? '☑' : '☐'}
          </span>
        </div>
        <p>${escapeHTML(it.body)}</p>
        <div class="pdf-warning">
          <strong>Если не сделать:</strong>
          ${escapeHTML(it.warning)}
        </div>
      </section>
    `).join('');

  return sheet;
}

function printFallback() {
  document.getElementById('print-version')
    .replaceChildren(makePdfSheet());

  window.print();
}

function loadPdfLibrary() {
  return new Promise((resolve, reject) => {
    if (window.html2pdf) return resolve();

    const script = document.createElement('script');
    script.src =
      'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';

    script.onload = resolve;
    script.onerror = reject;

    document.head.appendChild(script);
  });
}

document.getElementById('pdf').addEventListener('click', async () => {
  const btn = document.getElementById('pdf');
  const status = document.getElementById('status');

  btn.disabled = true;
  status.textContent = 'Подготавливаем PDF…';

  let container;

  try {
    await loadPdfLibrary();

    // Создаем временный контейнер.
    // Он остается в видимой области документа,
    // чтобы html2canvas мог его захватить.
    container = document.createElement('div');

    container.style.cssText = `
      position: absolute;
      left: 0;
      top: 0;
      width: 794px;
      z-index: -1;
      pointer-events: none;
      background: #ffffff;
    `;

    const sheet = makePdfSheet();
    container.appendChild(sheet);
    document.body.appendChild(container);

    // Даем браузеру завершить отрисовку.
    await new Promise(resolve =>
      requestAnimationFrame(() =>
        requestAnimationFrame(resolve)
      )
    );

    const options = {
      margin: 0,
      filename: 'Памятка_по_обособленным_подразделениям.pdf',

      image: {
        type: 'jpeg',
        quality: 0.98
      },

      html2canvas: {
        scale: 2,
        useCORS: true,
        backgroundColor: '#ffffff',
        scrollX: 0,
        scrollY: 0
      },

      jsPDF: {
        unit: 'px',
        format: [794, 1123],
        orientation: 'portrait'
      },

      pagebreak: {
        mode: ['css', 'legacy']
      }
    };

    await html2pdf()
      .set(options)
      .from(sheet)
      .save();

    status.textContent = '';

  } catch (error) {
    console.error('Ошибка создания PDF:', error);

    status.textContent =
      'Автоматическое сохранение недоступно. Используйте печать в PDF.';

    printFallback();

  } finally {
    if (container) container.remove();
    btn.disabled = false;
  }
});


// Высота фрейма не зависит от всплывающих подсказок.
let lastHeight=0;
function reportHeight() {
  const h=Math.ceil(document.getElementById('widget').getBoundingClientRect().height);
  if(h!==lastHeight) {
    lastHeight=h;
    if(window.parent!==window)
      window.parent.postMessage({type:'fd-checklist-height',height:h},'*');
  }
}
window.addEventListener('load',reportHeight);
if('ResizeObserver'in window)
  new ResizeObserver(reportHeight).observe(document.getElementById('widget'));
reportHeight();
</script>
</body>
</html>
